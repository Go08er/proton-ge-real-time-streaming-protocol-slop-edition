# Qualification-only backend. The public test URL is exposed by the bounded
# loopback TCP gate after publication and native decoding have passed.

logLevel: info
logDestinations: [stdout]
readTimeout: 5s
writeTimeout: 5s

api: false
metrics: false
pprof: false
playback: false

rtsp: true
rtspTransports: [tcp]
rtspEncryption: "no"
rtspAddress: 127.0.0.1:18555

rtmp: false
hls: false
webrtc: false
srt: false
moq: false

authInternalUsers:
  - user: any
    pass:
    ips: ["127.0.0.1"]
    permissions:
      - action: publish
        path: fixture
      - action: read
        path: fixture

paths:
  fixture:
    source: publisher
