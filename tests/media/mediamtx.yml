# SPDX-License-Identifier: BSD-3-Clause
# Local-only MediaMTX v1 fixture. Do not replace loopback with a LAN binding.

logLevel: info
logDestinations: [stdout]
readTimeout: 5s
writeTimeout: 5s

api: false
metrics: false
pprof: false
playback: false

rtsp: true
rtspTransports: [tcp]
rtspEncryption: "no"
rtspAddress: 127.0.0.1:8554

rtmp: false
hls: false
webrtc: false
srt: false
moq: false

authInternalUsers:
  - user: any
    pass:
    ips: ["127.0.0.1"]
    permissions:
      - action: publish
        path: fixture
      - action: read
        path: fixture

paths:
  fixture:
    source: publisher
